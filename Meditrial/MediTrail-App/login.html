<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrail - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-center h-16">
                <i class="fas fa-heartbeat text-primary text-2xl mr-2"></i>
                <span class="font-bold text-xl tracking-tight text-gray-900">MediTrail</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-md border border-gray-100">
            <div>
                <h2 class="text-center text-3xl font-extrabold text-gray-900">
                    Welcome to MediTrail
                </h2>
                <p class="mt-2 text-center text-sm text-gray-600">
                    Your medical history, wherever care happens.
                </p>
            </div>
            
            <div class="mt-8 space-y-6">
                <div class="text-center mb-6">
                    <p class="text-sm font-medium text-gray-500 uppercase tracking-wide">Demo Mode Login</p>
                </div>
                
                <a href="index.html" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-user text-blue-300 group-hover:text-blue-200"></i>
                    </span>
                    Login as Patient (John Doe)
                </a>

                <a href="doctor.html" class="group relative w-full flex justify-center py-4 px-4 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-user-md text-gray-400 group-hover:text-gray-500"></i>
                    </span>
                    Login as Doctor (Dr. Sarah Smith)
                </a>
            </div>

            <div class="mt-6 border-t border-gray-200 pt-6">
                <p class="text-xs text-center text-gray-500">
                    <i class="fas fa-shield-alt mr-1"></i> Data is stored securely and isolated between accounts.
                </p>
            </div>
        </div>
    </main>

</body>
</html>
